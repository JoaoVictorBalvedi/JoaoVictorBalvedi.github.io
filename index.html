<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>João Victor Balvedi — Full Stack Developer</title>
  <meta name="description" content="João Victor Balvedi — full stack developer. Projects, experience and personal things.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23e5412d'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- ao publicar mudanças em CSS/JS, aumente o ?v= para o navegador não usar a versão em cache -->
  <link rel="stylesheet" href="style.css?v=9">
  <script>
    // aplica o tema antes de renderizar para evitar "flash"
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <a href="#top" class="brand" id="brand"></a>
    <nav class="nav">
      <a href="#about"><span>01</span><b data-i18n="about"></b></a>
      <a href="#experience"><span>02</span><b data-i18n="experience"></b></a>
      <a href="#recognition"><span>03</span><b data-i18n="awards"></b></a>
      <a href="#projects"><span>04</span><b data-i18n="projects"></b></a>
      <a href="#personal"><span>05</span><b data-i18n="personal"></b></a>
      <a href="#contact"><span>06</span><b data-i18n="contact"></b></a>
    </nav>
    <button class="lang-toggle mono" id="langToggle" data-i18n-aria="langAria">
      <span data-lang="en">EN</span>/<span data-lang="pt">PT</span>
    </button>
    <button class="theme-toggle" id="themeToggle" data-i18n-aria="themeAria">
      <span class="theme-dot"></span>
    </button>
  </header>

  <main id="top">
    <!-- HERO -->
    <section class="hero">
      <canvas id="field" aria-hidden="true"></canvas>
      <div class="hero-inner">
        <p class="mono eyebrow" id="heroEyebrow"></p>
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-lede" id="heroLede"></p>
        <div class="hero-meta mono">
          <span id="heroLocation"></span>
          <span class="status"><i></i><span id="heroStatus"></span></span>
          <span id="clock"></span>
        </div>
      </div>
      <a href="#about" class="scroll-cue mono" data-i18n="scroll" data-i18n-aria="scrollAria"></a>
    </section>

    <!-- 01 ABOUT -->
    <section class="section" id="about">
      <div class="section-label"><span class="mono">01</span><h2 data-i18n="about"></h2></div>
      <div class="section-body about">
        <div class="about-text" id="aboutText"></div>
        <aside class="about-side">
          <h3 class="mono small-title" data-i18n="toolkit"></h3>
          <ul class="chips" id="skills"></ul>
          <h3 class="mono small-title" data-i18n="now"></h3>
          <ul class="now" id="now"></ul>
          <h3 class="mono small-title" style="margin-top:32px" data-i18n="languages"></h3>
          <ul class="now languages" id="languages"></ul>
        </aside>
      </div>
    </section>

    <!-- 02 EXPERIENCE -->
    <section class="section" id="experience">
      <div class="section-label"><span class="mono">02</span><h2 data-i18n="experience"></h2></div>
      <div class="section-body">
        <ol class="timeline" id="jobs"></ol>
        <h3 class="subsection-title"><span data-i18n="education"></span></h3>
        <ol class="timeline" id="education"></ol>
      </div>
    </section>

    <!-- 03 RECOGNITION -->
    <section class="section" id="recognition">
      <div class="section-label"><span class="mono">03</span><h2 data-i18n="awards"></h2></div>
      <div class="section-body">
        <p class="section-intro" id="recognitionIntro"></p>
        <ol class="awards" id="awards"></ol>
      </div>
    </section>

    <!-- 04 PROJECTS -->
    <section class="section" id="projects">
      <div class="section-label"><span class="mono">04</span><h2 data-i18n="projects"></h2></div>
      <div class="section-body">
        <div class="filters mono" id="filters" role="tablist" data-i18n-aria="filterAria"></div>
        <ul class="projects" id="projectList"></ul>
      </div>
      <div class="preview" id="preview" aria-hidden="true"><img alt=""></div>
    </section>

    <!-- 05 PERSONAL -->
    <section class="section" id="personal">
      <div class="section-label"><span class="mono">05</span><h2 data-i18n="personal"></h2></div>
      <div class="section-body">
        <p class="section-intro" id="personalIntro"></p>
        <div class="personal-grid" id="personalGrid"></div>
      </div>
    </section>

    <!-- 06 CONTACT -->
    <section class="section contact" id="contact">
      <div class="section-label"><span class="mono">06</span><h2 data-i18n="contact"></h2></div>
      <div class="section-body">
        <p class="contact-lede" id="contactLede"></p>
        <a class="contact-mail" id="contactMail"></a>
        <ul class="socials mono" id="socials"></ul>
      </div>
    </section>
  </main>

  <footer class="footer mono">
    <span id="footerName"></span>
    <span data-i18n="footer"></span>
    <a href="#top" data-i18n="top"></a>
  </footer>

  <script src="data.js?v=9"></script>
  <script src="main.js?v=9"></script>
</body>
</html>
