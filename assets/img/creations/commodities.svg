<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1b18"/>
      <stop offset="1" stop-color="#11100e"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece7dc" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ece7dc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a43" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ff5a43" stop-opacity=".38"/>
    </linearGradient>
    <pattern id="grid" width="68" height="68" patternUnits="userSpaceOnUse">
      <path d="M68 0H0V68" fill="none" stroke="#ece7dc" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#grid)"/>

  <text x="64" y="112" font-family="ui-monospace, Consolas, monospace" font-size="21" letter-spacing="4" fill="#8c877c">SOY · CORN · COFFEE</text>
  <text x="64" y="186" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="66" fill="#ece7dc">what comes next</text>

  <!-- volume -->
  <g fill="#ece7dc" fill-opacity=".13">
    <rect x="64" y="846" width="22" height="54"/><rect x="100" y="828" width="22" height="72"/>
    <rect x="136" y="860" width="22" height="40"/><rect x="172" y="812" width="22" height="88"/>
    <rect x="208" y="840" width="22" height="60"/><rect x="244" y="798" width="22" height="102"/>
    <rect x="280" y="834" width="22" height="66"/><rect x="316" y="808" width="22" height="92"/>
    <rect x="352" y="850" width="22" height="50"/><rect x="388" y="790" width="22" height="110"/>
    <rect x="424" y="826" width="22" height="74"/><rect x="460" y="806" width="22" height="94"/>
  </g>

  <!-- histórico -->
  <path d="M64 700 L100 676 L136 690 L172 648 L208 664 L244 618 L280 642 L316 598 L352 616 L388 566 L424 590 L460 552 L500 560 L500 900 L64 900 Z" fill="url(#area)"/>
  <polyline points="64,700 100,676 136,690 172,648 208,664 244,618 280,642 316,598 352,616 388,566 424,590 460,552 500,560"
            fill="none" stroke="#ece7dc" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- hoje -->
  <line x1="500" y1="250" x2="500" y2="900" stroke="#ece7dc" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 10"/>
  <text x="512" y="276" font-family="ui-monospace, Consolas, monospace" font-size="18" letter-spacing="3" fill="#8c877c">TODAY</text>

  <!-- previsão com faixa de confiança -->
  <path d="M500 560 L560 512 L620 466 L680 424 L736 378 L736 590 L680 588 L620 576 L560 568 Z" fill="url(#band)"/>
  <polyline points="500,560 560,540 620,519 680,503 736,478"
            fill="none" stroke="#ff5a43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 14"/>
  <circle cx="500" cy="560" r="11" fill="#11100e" stroke="#ece7dc" stroke-width="4"/>
  <circle cx="736" cy="478" r="9" fill="#ff5a43"/>

  <text x="64" y="948" font-family="ui-monospace, Consolas, monospace" font-size="18" letter-spacing="3" fill="#6f6a60">t</text>
  <text x="700" y="948" font-family="ui-monospace, Consolas, monospace" font-size="18" letter-spacing="3" fill="#ff5a43">t+30</text>
</svg>
